name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    env:
      COMPACT_VERSION: 0.31.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      - name: Pin Compact toolchain
        run: compact update "$COMPACT_VERSION" && compact compile --version

      - run: npm ci

      - name: Compile contract to ZK circuits
        run: npm run compile

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
